x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CHAT_CHECKPOINT_SIGNING_KEY: ${CHAT_CHECKPOINT_SIGNING_KEY:?Set CHAT_CHECKPOINT_SIGNING_KEY}
      CHAT_TRUST_PROXY_HEADERS: "true"
      DEBUG: ${DEBUG:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      AUTH_FRONTEND_ORIGIN: ${AUTH_FRONTEND_ORIGIN:?Set AUTH_FRONTEND_ORIGIN}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:?Set DB_PORT}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BASEBALL_DB_USER: ${BASEBALL_DB_USER:-}
      BASEBALL_DB_PASSWORD: ${BASEBALL_DB_PASSWORD:-}
      BASEBALL_QUERY_MAX_ROWS: ${BASEBALL_QUERY_MAX_ROWS:-200}
      BASEBALL_QUERY_TIMEOUT_MS: ${BASEBALL_QUERY_TIMEOUT_MS:-3000}
      BASEBALL_QUERY_LOCK_TIMEOUT_MS: ${BASEBALL_QUERY_LOCK_TIMEOUT_MS:-1000}
      BASEBALL_QUERY_MAX_SQL_BYTES: ${BASEBALL_QUERY_MAX_SQL_BYTES:-32768}
      BASEBALL_QUERY_MAX_RESPONSE_BYTES: ${BASEBALL_QUERY_MAX_RESPONSE_BYTES:-1048576}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:?Set EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:?Set EMAIL_USE_TLS}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      COMMUNITY_IMAGE_S3_ENDPOINT: http://minio:9000
      COMMUNITY_IMAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      COMMUNITY_IMAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      COMMUNITY_IMAGE_S3_BUCKET: ${COMMUNITY_IMAGE_S3_BUCKET:-community-images}
      COMMUNITY_IMAGE_S3_REGION: ${COMMUNITY_IMAGE_S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py setup_chat_checkpoints &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
        YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    restart: unless-stopped
    environment:
      # NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

volumes:
  minio_data:
