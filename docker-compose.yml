x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ========================
  # PostgreSQL + pgvector1
  # ========================
  db:
    image: pgvector/pgvector:pg18
    profiles: ["local"]
    restart: unless-stopped

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18에서는 상위 디렉터리를 마운트
      - postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}


  # ========================
  # Django Backend
  # ========================
  backend:
    build: ./backend
    restart: unless-stopped

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # 로컬 프로필일 때만 API 요청 기반 크롤링을 활성화한다.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      CHAT_CHECKPOINT_SIGNING_KEY: ${CHAT_CHECKPOINT_SIGNING_KEY:?Set CHAT_CHECKPOINT_SIGNING_KEY}
      CHAT_TRUST_PROXY_HEADERS: "true"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      # LangSmith 추적·평가. 키가 없으면 traceable 이 no-op 이라 오버헤드 0
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: 'https://api.smith.langchain.com'
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-kbo-rag}
      # 챗봇이 지도와 같은 카카오 장소(숙박·산책·실내놀거리)를 조회할 때 쓰는 REST 키 (프론트와 같은 키)
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      AUTH_FRONTEND_ORIGIN: ${AUTH_FRONTEND_ORIGIN:-http://127.0.0.1:80}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}

      # 로컬에서는 db 컨테이너, 서버에서는 RDS (.env의 DB_HOST) 사용
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BASEBALL_DB_USER: ${BASEBALL_DB_USER:-}
      BASEBALL_DB_PASSWORD: ${BASEBALL_DB_PASSWORD:-}
      BASEBALL_QUERY_MAX_ROWS: ${BASEBALL_QUERY_MAX_ROWS:-200}
      BASEBALL_QUERY_TIMEOUT_MS: ${BASEBALL_QUERY_TIMEOUT_MS:-3000}
      BASEBALL_QUERY_LOCK_TIMEOUT_MS: ${BASEBALL_QUERY_LOCK_TIMEOUT_MS:-1000}
      BASEBALL_QUERY_MAX_SQL_BYTES: ${BASEBALL_QUERY_MAX_SQL_BYTES:-32768}
      BASEBALL_QUERY_MAX_RESPONSE_BYTES: ${BASEBALL_QUERY_MAX_RESPONSE_BYTES:-1048576}
      EXTERNAL_DATA_SYNC_INTERVAL_SECONDS: ${EXTERNAL_DATA_SYNC_INTERVAL_SECONDS:-600}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      COMMUNITY_IMAGE_S3_ENDPOINT: http://minio:9000
      COMMUNITY_IMAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      COMMUNITY_IMAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword}
      COMMUNITY_IMAGE_S3_BUCKET: ${COMMUNITY_IMAGE_S3_BUCKET:-community-images}
      COMMUNITY_IMAGE_S3_REGION: ${COMMUNITY_IMAGE_S3_REGION:-us-east-1}

    volumes:
      - ./backend:/app

      # build_index에서 읽는 전처리 CSV
      - ./data:/data:ro

      # build_index에서 읽는 JSON / md
      - ./docs:/docs:ro

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_started
        required: false
      minio:
        condition: service_healthy

    # python manage.py provision_baseball_reader --prepare-db-permissions &&
    command: >
      sh -c "python manage.py migrate &&
             python manage.py setup_chat_checkpoints &&
             python manage.py runserver 0.0.0.0:8000"

    logging: *default-logging


  # ========================
  # Next.js Frontend
  # ========================
  frontend:
    build: ./frontend
    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    ports:
      - "3000:3000"

    depends_on:
      - backend

    environment:
      # NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-127.0.0.1,localhost}

    logging: *default-logging


  # ========================
  # Nginx
  # ========================
  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend

    logging: *default-logging


  # ========================
  # Mailpit
  # ========================
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *default-logging

    ports:
      - "1025:1025"
      - "8025:8025"

    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?Set MAILPIT_UI_AUTH for the local Mailpit web UI}

    volumes:
      - ./data/mailpit:/data

  # ========================
  # MiniO
  # ========================
  minio:
    image: local/minio:RELEASE.2025-10-15T17-29-55Z

    build:
      context: .
      dockerfile: minio.dockerfile

    restart: unless-stopped
    logging: *default-logging

    command: server /data --console-address ":9001"

    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10


# ========================
# Named Volumes
# ========================
volumes:
  postgres_data:
  minio_data:
